[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetsent"
version = "0.1.0"
description = "Does Twitter sentiment predict stock returns? VADER sentiment, SVR and random forests, evaluated walk-forward"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atharva Dhoot" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "statsmodels>=0.14", "matplotlib>=3.7", "tabulate>=0.9"]

[project.optional-dependencies]
prepare = ["nltk>=3.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
